name: CI

# Builds the Cesium devkit of every host in devkit.json: the pinned official
# Zig, LLVM and LLD cross-compiled with it as static libraries (no Clang, no
# tools) with zlib and zstd, and the pinned QBE. Each devkit is smoke-tested
# on the host's own runner. A push to main whose devkit.json version has no
# release yet publishes them as the immutable release v<version>.
#
# Pull requests into main and pushes to main are run. Pushes to dev and pull
# requests into it are not (emanspeaks, 2026-11-21; as zfls and rstd do): dev
# is checked as a whole by the standing pull request from dev to main, whose
# run each merge into dev restarts. To check one branch alone, start the
# workflow by hand: `gh workflow run ci.yml --ref BRANCH`.
#
# Versions: devkit.json holds the version the next release will have. A pull
# request into main that changes a devkit must carry a version that has no
# release yet. After a release, main is merged back into dev, where the next
# patch version is begun; for a minor or major release, set the version on
# dev by hand.
#
# Pull requests into main come from dev (the standing pull request) and from
# the branches of automated updates, named <what>-updates-<id>: the Follow
# QBE workflow opens one from qbe-updates-<commit> for a new QBE, with the
# next patch version, so that it is a release of its own.
#
# A pull request builds and tests without publishing. A push or pull request
# that changes only files of no-ci.txt skips the work, and the CI job passes
# at once.
#
# Jobs:
#   changes  skip everything for a change to only files of no-ci.txt
#   prepare  the version, the host matrix, and whether this run publishes
#   lint     shellcheck, and the submodules against the pins of devkit.json
#   build    one devkit per host, cross-compiled on Linux
#   smoke    each devkit on its own host
#   publish  the release v<version>: archives, manifests, devkits.json, SHA256SUMS
#   begin-next-version  main merged back into dev, with the next version
#   CI       the one check the rulesets require

on:
  push:
    # (not dev: see the top)
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release even from a branch other than main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: true
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPRESS: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      ci: ${{ steps.changes.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Anything outside no-ci.txt changed?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/changes.sh "$EVENT" "$BEFORE" "$AFTER" | tee -a "$GITHUB_OUTPUT"

  prepare:
    name: Prepare
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pins.outputs.version }}
      hosts: ${{ steps.pins.outputs.hosts }}
      llvm_key: ${{ steps.pins.outputs.llvm_key }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Read devkit.json
        id: pins
        run: |
          {
            echo "version=$(jq -er .version devkit.json)"
            echo "hosts=$(jq -c .hosts devkit.json)"
            # what the LLVM objects depend on: the pins and the build script
            echo "llvm_key=$(jq -c '[.zig.version, .llvm]' devkit.json | cat - scripts/build-llvm.sh | sha256sum | cut -c1-16)"
          } | tee -a "$GITHUB_OUTPUT"

      # a devkit that differs from a released one must not carry its version
      - name: A pull request into main carries an unreleased version
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pins.outputs.version }}
        run: |
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error file=devkit.json::version is $VERSION, and v$VERSION is already released. Set a newer version."
            exit 1
          fi

      - name: Does this run publish?
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pins.outputs.version }}
          WANT: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.publish == true }}
        run: |
          if [ "$WANT" != true ]; then
            echo "publish=false" | tee -a "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::v$VERSION is already released; bump the version in devkit.json to publish again"
            echo "publish=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "publish=true" | tee -a "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck --severity=warning -x scripts/*.sh .github/scripts/*.sh

      - name: Submodules match devkit.json
        run: |
          check () { # <path> <pinned commit>
            got=$(git ls-tree HEAD "$1" | awk '{print $3}')
            [ "$got" = "$2" ] || { echo "::error::$1 is at $got, devkit.json pins $2"; exit 1; }
          }
          check llvm-project "$(jq -er .llvm.commit devkit.json)"
          check qbe "$(jq -er .qbe.commit devkit.json)"

  build:
    name: Build ${{ matrix.host.triple }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.prepare.outputs.hosts) }}
    env:
      HOST: ${{ matrix.host.triple }}
    steps:
      - uses: actions/checkout@v7

      # llvm-project at one commit only: its history is several gigabytes
      - name: Check out the submodules
        run: |
          for i in 1 2 3 4 5; do
            git submodule update --init --depth 1 llvm-project && git submodule update --init qbe && break
            [ "$i" = 5 ] && { echo "::error::could not fetch the submodules"; exit 1; }
            sleep $((i * 30))
          done

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/julia* /usr/lib/jvm /usr/share/miniconda
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build ccache xz-utils zip jq

      - name: Build QBE
        run: bash scripts/build-qbe.sh "$HOST"

      - name: Build zlib and zstd
        run: bash scripts/build-compression.sh "$HOST"

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-llvm-${{ matrix.host.triple }}-${{ needs.prepare.outputs.llvm_key }}-${{ github.run_id }}
          restore-keys: |
            ccache-llvm-${{ matrix.host.triple }}-${{ needs.prepare.outputs.llvm_key }}-

      # stops itself before the 6h job limit so the ccache is saved; running
      # the workflow again resumes from it
      - name: Build LLVM and LLD
        run: |
          set +e
          CCACHE=ccache timeout 320m bash scripts/build-llvm.sh "$HOST"
          rc=$?
          set -e
          ccache -s
          [ $rc = 124 ] && echo "::error::time limit reached; re-run the job to resume from the ccache"
          exit $rc

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-llvm-${{ matrix.host.triple }}-${{ needs.prepare.outputs.llvm_key }}-${{ github.run_id }}

      - name: Package
        run: bash scripts/package.sh "$HOST"

      - uses: actions/upload-artifact@v7
        with:
          name: devkit-${{ matrix.host.triple }}
          path: dist/*
          retention-days: 5
          # the archives are already compressed
          compression-level: 0

  smoke:
    name: Smoke ${{ matrix.host.triple }}
    needs: [prepare, build]
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.prepare.outputs.hosts) }}
    env:
      HOST: ${{ matrix.host.triple }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: devkit-${{ matrix.host.triple }}
          path: dist

      - name: Unpack
        run: |
          name=cesium-devkit-$HOST-$VERSION
          mkdir kit
          case $HOST in
            *-windows-*) unzip -q "dist/$name.zip" -d kit ;;
            *) tar -xJf "dist/$name.tar.xz" -C kit ;;
          esac

      - name: Smoke test
        run: bash scripts/smoke.sh "kit/cesium-devkit-$HOST-$VERSION"

  publish:
    name: Publish
    needs: [prepare, smoke]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: devkit-*
          path: dist
          merge-multiple: true

      # devkits.json is the lookup for consumers: for each host, the archive,
      # its sha256 and its URL in this release
      - name: Write devkits.json and SHA256SUMS
        working-directory: dist
        run: |
          sha256sum cesium-devkit-*.tar.xz cesium-devkit-*.zip > SHA256SUMS
          cat SHA256SUMS
          entries='{}'
          for manifest in cesium-devkit-*.json; do
            host=$(jq -er .host "$manifest")
            # ls would fail the step for the archive type the host does not have
            asset=${manifest%.json}.tar.xz
            [ -f "$asset" ] || asset=${manifest%.json}.zip
            [ -f "$asset" ] || { echo "::error::no archive for $manifest"; exit 1; }
            sum=$(sha256sum "$asset" | cut -d' ' -f1)
            entries=$(jq --arg h "$host" --arg a "$asset" --arg s "$sum" --arg m "$manifest" \
              --arg repo "$GITHUB_REPOSITORY" --arg tag "v$VERSION" \
              '. + {($h): {asset: $a, sha256: $s, manifest: $m,
                url: "https://github.com/\($repo)/releases/download/\($tag)/\($a)"}}' <<< "$entries")
          done
          jq --argjson e "$entries" --arg commit "$GITHUB_SHA" \
            '{version, commit: $commit, zig: .zig.version, llvm: .llvm, qbe: .qbe.commit, devkits: $e}' \
            ../devkit.json > devkits.json
          cat devkits.json

      # immutable: the release is created with every asset, never added to
      - name: Publish
        working-directory: dist
        run: |
          gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Cesium devkits $VERSION" \
            --notes "Devkits for building the Cesium compiler: Zig $(jq -er .zig devkits.json), LLVM and LLD $(jq -er .llvm.version devkits.json) (static libraries, targets $(jq -er '.llvm.targets | join(", ")' devkits.json), with zlib $(jq -er .llvm.zlib.version devkits.json) and zstd $(jq -er .llvm.zstd.version devkits.json)), and QBE at \`$(jq -er '.qbe[0:7]' devkits.json)\`. \`devkits.json\` lists the archive of each host with its sha256." \
            cesium-devkit-* devkits.json SHA256SUMS

  # The next version is begun on dev: main keeps the version it released. A
  # separate job, so that a push dev refuses does not undo the release.
  begin-next-version:
    name: Merge v${{ needs.prepare.outputs.version }} into dev and begin the next version
    needs: [prepare, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A fast-forward when dev has nothing of its own, else a merge commit.
      # Where both changed the same lines, dev's are kept: that is the version,
      # when dev had begun a later one than an update released from main.
      - name: Merge into dev and begin the next version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tagged() { git rev-parse -q --verify "refs/tags/v$1" >/dev/null; }
          for attempt in 1 2 3; do
            git fetch -q --tags origin dev
            git checkout -q -B dev origin/dev
            if ! git merge -q -X ours -m "Merge v$VERSION into dev [skip ci]" "$GITHUB_SHA"; then
              git merge --abort
              echo "::error::v$VERSION conflicts with dev; merge main into dev by hand and set the next version"
              exit 1
            fi
            version=$(jq -er .version devkit.json)
            if tagged "$version"; then
              next=$version
              while tagged "$next"; do
                IFS=. read -r ma mi pa <<< "$next"
                next="$ma.$mi.$((pa + 1))"
              done
              # the first "version" of the file is the devkit's own
              sed -i -E "0,/^  \"version\": \"[^\"]+\"/ s//  \"version\": \"$next\"/" devkit.json
              git commit -qam "Begin v$next development [skip ci]"
            fi
            if git push -q origin dev; then exit 0; fi
            echo "dev moved while merging; trying again"
          done
          echo "::error::could not push to dev"
          exit 1

  ci:
    name: CI
    needs: [changes, prepare, lint, build, smoke, publish, begin-next-version]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case $r in
              success | skipped) ;;
              *) echo "::error::a job ended as $r"; exit 1 ;;
            esac
          done
