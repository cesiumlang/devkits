name: Follow QBE

# When the master of the mirror cesiumlang/qbe has commits the released devkit
# lacks, opens a pull request into main that is a release of its own, as a
# dependency bot would: from main, on a branch named qbe-updates-<commit>, the
# qbe submodule and its pin in devkit.json move to the mirror's master and the
# version becomes the next unreleased patch version.
#
# The pull request then goes the way of every release: CI builds and
# smoke-tests every host for it (it is a pull request into main); merging it
# publishes the release, and CI merges main back into dev and begins the next
# version there (ci.yml).
#
# An update pull request that a newer one replaces is closed and its branch
# deleted. Nothing is done while the newest one is already open.
#
# The branch is pushed and the pull request opened as the Cesium Agent app,
# because what the workflow's own token pushes or opens starts no CI. Needs
# the secret CESIUM_AGENT_PRIVATE_KEY: a private key of that app.

on:
  schedule:
    - cron: '47 5 * * 1'   # Mondays 05:47 UTC, after the mirror's nightly sync
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MIRROR: https://github.com/cesiumlang/qbe.git
  # the branches of update pull requests: this, and the mirror's commit
  PREFIX: qbe-updates-

jobs:
  follow:
    runs-on: ubuntu-24.04
    steps:
      # main, with its tags, to know which versions are released; without the
      # workflow token's credentials, so the push goes as the app
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Compare the pin with the mirror
        id: compare
        run: |
          pinned=$(jq -er .qbe.commit devkit.json)
          head=$(git ls-remote "$MIRROR" refs/heads/master | cut -f1)
          [ -n "$head" ] || { echo "::error::no master in $MIRROR"; exit 1; }
          branch=$PREFIX${head:0:7}
          echo "main pins $pinned, mirror master $head"
          move=true
          if [ "$head" = "$pinned" ]; then
            echo "qbe is current"
            move=false
          elif [ -n "$(git ls-remote origin "refs/heads/$branch")" ]; then
            echo "$branch is there already"
            move=false
          fi
          { echo "pinned=$pinned"; echo "head=$head"; echo "branch=$branch"; echo "move=$move"; } >> "$GITHUB_OUTPUT"

      - name: Is the app's key set?
        if: steps.compare.outputs.move == 'true'
        env:
          KEY: ${{ secrets.CESIUM_AGENT_PRIVATE_KEY }}
        run: '[ -n "$KEY" ] || { echo "::error::the secret CESIUM_AGENT_PRIVATE_KEY is not set"; exit 1; }'

      - name: Get the app's token
        if: steps.compare.outputs.move == 'true'
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liXrtnf12IOEFv6c
          private-key: ${{ secrets.CESIUM_AGENT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Move qbe and its pin, and take the next version
        if: steps.compare.outputs.move == 'true'
        id: move
        env:
          PINNED: ${{ steps.compare.outputs.pinned }}
          HEAD: ${{ steps.compare.outputs.head }}
          BRANCH: ${{ steps.compare.outputs.branch }}
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git submodule update --init qbe
          git -C qbe fetch --quiet origin master
          # forward only: the mirror never rewrites master
          git -C qbe merge-base --is-ancestor "$PINNED" "$HEAD" \
            || { echo "::error::$HEAD does not descend from the pin $PINNED"; exit 1; }
          git -C qbe checkout --quiet --detach "$HEAD"
          # sed, not jq: jq would reformat the whole file
          sed -i -E "/\"qbe\": \{/,/\}/ s/(\"commit\": \")[0-9a-f]{40}/\1$HEAD/" devkit.json
          [ "$(jq -er .qbe.commit devkit.json)" = "$HEAD" ] || { echo "::error::could not write the pin"; exit 1; }

          # the next patch version that has no release yet
          tagged() { git rev-parse -q --verify "refs/tags/v$1" >/dev/null; }
          version=$(jq -er .version devkit.json)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::cannot read a MAJOR.MINOR.PATCH version (got '$version')"; exit 1; }
          next=$version
          while tagged "$next"; do
            IFS=. read -r ma mi pa <<< "$next"
            next="$ma.$mi.$((pa + 1))"
          done
          # the first "version" of the file is the devkit's own
          sed -i -E "0,/^  \"version\": \"[^\"]+\"/ s//  \"version\": \"$next\"/" devkit.json
          [ "$(jq -er .version devkit.json)" = "$next" ] || { echo "::error::could not write the version"; exit 1; }
          echo "version=$next" >> "$GITHUB_OUTPUT"

          git -C qbe log --oneline "$PINNED..$HEAD" | tee qbe-log.txt
          git config user.name 'cesium-agent[bot]'
          git config user.email '359230132+cesium-agent[bot]@users.noreply.github.com'
          git switch --quiet -c "$BRANCH"
          git add qbe devkit.json
          git commit --quiet -m "Move qbe to ${HEAD:0:7}: v$next"
          git push "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" "$BRANCH"

      - name: Open the pull request, and close the ones it replaces
        if: steps.compare.outputs.move == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PINNED: ${{ steps.compare.outputs.pinned }}
          HEAD: ${{ steps.compare.outputs.head }}
          BRANCH: ${{ steps.compare.outputs.branch }}
          VERSION: ${{ steps.move.outputs.version }}
        run: |
          {
            echo "A release of its own, opened by the **Follow QBE** workflow: the \`qbe\` submodule and its pin in \`devkit.json\` move from \`${PINNED:0:7}\` to \`${HEAD:0:7}\`, the master of [cesiumlang/qbe](https://github.com/cesiumlang/qbe), and the version becomes $VERSION."
            echo
            echo "Upstream's commits since the pin:"
            echo
            echo '```text'
            cat qbe-log.txt
            echo '```'
            echo
            echo "CI builds and smoke-tests every host for this pull request. Merging it publishes **v$VERSION**; CI then merges \`main\` back into \`dev\` and begins the next version there."
          } > body.md
          new=$(gh pr create --base main --head "$BRANCH" --title "Move qbe to ${HEAD:0:7}: v$VERSION" --body-file body.md)
          echo "$new"
          # the update pull requests this one replaces
          gh pr list --base main --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"$PREFIX\")) | select(.headRefName != \"$BRANCH\") | .number" |
            while read -r old; do
              gh pr close "$old" --delete-branch --comment "Replaced by $new, which carries a newer QBE."
            done
